<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>交付物版本画廊 · Artifact Gallery</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #f4f5f7; color: #1f2329; }
  header { height: 52px; flex: 0 0 52px; background: #1f2329; color: #fff; display: flex; align-items: center; padding: 0 18px; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: #b7bcc4; }
  .layout { flex: 1; display: flex; min-height: 0; }
  /* 左栏：产物清单 */
  .art-list { width: 250px; flex: 0 0 250px; background: #fff; border-right: 1px solid #e6e8eb; overflow-y: auto; }
  .art-list .item { padding: 11px 14px; border-bottom: 1px solid #f0f1f3; cursor: pointer; font-size: 13px; line-height: 1.4; display: flex; gap: 8px; align-items: flex-start; }
  .art-list .item:hover { background: #f7f8fa; }
  .art-list .item.active { background: #eaf2ff; border-left: 3px solid #2b6cff; padding-left: 11px; }
  .art-list .item .badge { flex: 0 0 auto; background: #2b6cff; color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 7px; margin-top: 1px; }
  .art-list .item .nm { word-break: break-all; }
  /* 中栏：预览 */
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .center .bar { height: 46px; flex: 0 0 46px; background: #fff; border-bottom: 1px solid #e6e8eb; display: flex; align-items: center; padding: 0 14px; gap: 12px; }
  .center .bar .title { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .center .bar .cur { font-size: 12px; color: #5a6573; }
  .center .bar button { border: 1px solid #e6e8eb; background: #fff; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .center .bar button.revert { background: #2b6cff; color: #fff; border-color: #2b6cff; display: none; }
  .center .bar button.revert:hover { background: #1d5bef; }
  .center .bar a.open { font-size: 12px; color: #2b6cff; text-decoration: none; }
  .preview-box { flex: 1; background: #fff; min-height: 0; }
  .preview-box iframe { width: 100%; height: 100%; border: 0; }
  .preview-box .dl { padding: 40px; text-align: center; color: #5a6573; }
  .preview-box .dl a { color: #2b6cff; }
  /* 右栏：版本缩略图（PPT 风格，最新在底部） */
  .versions { width: 268px; flex: 0 0 268px; background: #fafbfc; border-left: 1px solid #e6e8eb; overflow-y: auto; padding: 12px; }
  .versions .vh { font-size: 12px; color: #8a93a0; margin: 2px 4px 10px; display: flex; justify-content: space-between; }
  .vcard { background: #fff; border: 2px solid #e6e8eb; border-radius: 8px; margin-bottom: 12px; cursor: pointer; overflow: hidden; transition: border-color .15s; }
  .vcard:hover { border-color: #b9c6e6; }
  .vcard.active { border-color: #2b6cff; }
  .vcard.current { border-color: #18a058; }
  .vcard .thumb { width: 100%; height: 150px; overflow: hidden; background: #f0f1f3; position: relative; }
  .vcard .thumb iframe { width: 1200px; height: 900px; transform: scale(0.213); transform-origin: top left; border: 0; pointer-events: none; }
  .vcard .thumb .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8a93a0; font-size: 13px; gap: 6px; }
  .vcard .meta { padding: 7px 10px; font-size: 12px; }
  .vcard .meta .vtag { font-weight: 600; color: #1f2329; }
  .vcard .meta .vtag .now { color: #18a058; font-size: 11px; margin-left: 6px; }
  .vcard .meta .vts { color: #8a93a0; font-size: 11px; }
  .vcard .meta .vdesc { color: #5a6573; margin-top: 3px; word-break: break-all; }
  .empty { padding: 40px; text-align: center; color: #8a93a0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>交付物版本画廊</h1>
  <span class="sub" id="sub">Artifact Gallery · 左栏全部产物 / 中栏放大预览 / 右栏版本缩略图（最新在底部）</span>
</header>
<div class="layout">
  <div class="art-list" id="artList"><div class="empty">加载中…</div></div>
  <div class="center">
    <div class="bar">
      <span class="title" id="cTitle">请选择左侧产物</span>
      <span class="cur" id="cCur"></span>
      <a class="open" id="cOpen" target="_blank" style="display:none">新标签页打开</a>
      <button class="revert" id="cRevert">↩ 回撤到此版本</button>
    </div>
    <div class="preview-box" id="previewBox"><div class="empty">从右侧选择任意版本缩略图即可在此放大预览（不会改动文件）。</div></div>
  </div>
  <div class="versions" id="versions"><div class="empty">选择产物后显示版本时间线</div></div>
</div>

<script>
let MANIFEST = { artifacts: [] };
let selArt = null, selVer = null;

const $ = id => document.getElementById(id);

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function loadManifest() {
  const r = await fetch('/api/manifest');
  MANIFEST = await r.json();
  renderList();
  if (!selArt && MANIFEST.artifacts.length) selectArt(MANIFEST.artifacts[0].id);
}

function renderList() {
  const el = $('artList');
  if (!MANIFEST.artifacts.length) { el.innerHTML = '<div class="empty">暂无产物，运行 register_version.py 登记</div>'; return; }
  el.innerHTML = MANIFEST.artifacts.map(a => `
    <div class="item ${a.id===selArt?'active':''}" data-id="${a.id}">
      <span class="badge">v${a.current}</span>
      <span class="nm">${esc(a.name)}</span>
    </div>`).join('');
  el.querySelectorAll('.item').forEach(it => it.onclick = () => selectArt(it.dataset.id));
}

function selectArt(id) {
  selArt = id;
  const a = MANIFEST.artifacts.find(x => x.id === id);
  selVer = a ? a.current : null;
  renderList();
  renderVersions();
  showPreview();
}

function renderVersions() {
  const a = MANIFEST.artifacts.find(x => x.id === selArt);
  const box = $('versions');
  if (!a) { box.innerHTML = '<div class="empty">选择产物后显示版本时间线</div>'; return; }
  // 升序渲染 => 最新版本天然在最底部
  const cards = a.versions.map(v => {
    const isCur = v.v === a.current;
    const isSel = v.v === selVer;
    const thumb = (a.type === 'html')
      ? `<iframe src="/api/preview?art=${encodeURIComponent(a.id)}&v=${v.v}" loading="lazy"></iframe>`
      : `<div class="ph">📄<div>${esc(a.type.toUpperCase())} 文件</div></div>`;
    return `<div class="vcard ${isSel?'active':''} ${isCur?'current':''}" data-v="${v.v}">
      <div class="thumb">${thumb}</div>
      <div class="meta">
        <div class="vtag">v${v.v}${isCur?'<span class="now">当前</span>':''}</div>
        <div class="vts">${v.ts}</div>
        <div class="vdesc">${esc(v.desc)}</div>
      </div>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="vh"><span>版本时间线</span><span>共 ${a.versions.length} 版</span></div>` + cards;
  box.querySelectorAll('.vcard').forEach(c => c.onclick = () => { selVer = +c.dataset.v; renderVersions(); showPreview(); });
}

function showPreview() {
  const a = MANIFEST.artifacts.find(x => x.id === selArt);
  if (!a) return;
  $('cTitle').textContent = a.name;
  const v = a.versions.find(x => x.v === selVer);
  $('cCur').textContent = v ? `查看 v${v.v} · ${v.ts}` : '';
  const revertBtn = $('cRevert');
  if (v && v.v !== a.current) { revertBtn.style.display = 'inline-block'; }
  else { revertBtn.style.display = 'none'; }
  const box = $('previewBox');
  if (a.type === 'html') {
    $('cOpen').style.display = 'inline';
    $('cOpen').href = `/api/preview?art=${encodeURIComponent(a.id)}&v=${selVer}`;
    box.innerHTML = `<iframe src="/api/preview?art=${encodeURIComponent(a.id)}&v=${selVer}"></iframe>`;
  } else {
    $('cOpen').style.display = 'inline';
    $('cOpen').href = `/api/preview?art=${encodeURIComponent(a.id)}&v=${selVer}`;
    box.innerHTML = `<div class="dl">此产物为 ${esc(a.type.toUpperCase())} 文件，无法直接预览。<br><br><a href="/api/preview?art=${encodeURIComponent(a.id)}&v=${selVer}">点击下载 / 打开</a></div>`;
  }
}

$('cRevert').onclick = async () => {
  if (selVer == null) return;
  if (!confirm(`确认把「${selArt}」回撤到 v${selVer}？\n旧版本会被复制回工作文件，并记为一个新的回撤版本（历史保留）。`)) return;
  const r = await fetch('/api/revert', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ art: selArt, v: selVer })
  });
  if (r.ok) {
    MANIFEST = await r.json();
    // 回撤后 current 已变为新版本，保持查看刚回撤到的那一版
    selVer = MANIFEST.artifacts.find(x => x.id === selArt).current;
    renderList(); renderVersions(); showPreview();
    alert('已回撤，当前版本已更新（历史版本仍保留在右侧）。');
  } else {
    alert('回撤失败：' + (await r.text()));
  }
};

loadManifest();
</script>
</body>
</html>
